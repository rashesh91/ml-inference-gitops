apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-serving.fullname" . }}
  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vllm-serving.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.port }}
      protocol: TCP
    {{- end }}
---
# Headless service for StatefulSet pod DNS
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-serving.fullname" . }}-headless
  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "vllm-serving.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
