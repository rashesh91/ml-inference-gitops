{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vllm-serving.fullname" . }}-pdb
  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "vllm-serving.selectorLabels" . | nindent 6 }}
{{- end }}
