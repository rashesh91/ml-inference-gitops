{{- if .Values.llmAgent.enabled }}
{{- if eq .Values.llmAgent.backend "ollama" }}
# ── Ollama backend ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llm-agent
  labels:
    app: llm-agent
    component: llm
spec:
  replicas: 1
  selector:
    matchLabels: { app: llm-agent }
  serviceName: llm-agent-headless
  template:
    metadata:
      labels: { app: llm-agent, component: llm }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.llmAgent.gpu.enabled }}
      runtimeClassName: nvidia
      {{- end }}
      {{- if .Values.llmAgent.tolerations }}
      tolerations: {{- toYaml .Values.llmAgent.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.llmAgent.nodeSelector }}
      nodeSelector: {{- toYaml .Values.llmAgent.nodeSelector | nindent 8 }}
      {{- end }}
      initContainers:
        - name: model-puller
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              SERVER_PID=$!
              sleep 8
              ollama pull {{ .Values.llmAgent.model.ollamaModel }}
              kill $SERVER_PID
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests: { memory: "2Gi", cpu: "1" }
            limits:   { memory: "4Gi", cpu: "2" }
      containers:
        - name: ollama
          image: ollama/ollama:latest
          args: ["serve"]
          ports:
            - { containerPort: 11434, name: http }
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              memory: {{ .Values.llmAgent.resources.requests.memory | quote }}
              cpu: {{ .Values.llmAgent.resources.requests.cpu | quote }}
              {{- if .Values.llmAgent.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.llmAgent.gpu.count }}
              {{- end }}
            limits:
              memory: {{ .Values.llmAgent.resources.limits.memory | quote }}
              cpu: {{ .Values.llmAgent.resources.limits.cpu | quote }}
              {{- if .Values.llmAgent.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.llmAgent.gpu.count }}
              {{- end }}
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.llmAgent.persistence.storageClass }}
        storageClassName: {{ .Values.llmAgent.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.llmAgent.persistence.size }}
{{- else }}
# ── vLLM backend ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llm-agent
  labels:
    app: llm-agent
    component: llm
spec:
  replicas: {{ .Values.llmAgent.replicas }}
  selector:
    matchLabels: { app: llm-agent }
  serviceName: llm-agent-headless
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels: { app: llm-agent, component: llm }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.llmAgent.tolerations }}
      tolerations: {{- toYaml .Values.llmAgent.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.llmAgent.nodeSelector }}
      nodeSelector: {{- toYaml .Values.llmAgent.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.llmAgent.gpu.enabled }}
      runtimeClassName: nvidia
      {{- end }}
      initContainers:
        - name: model-downloader
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install -q boto3 huggingface-hub && python3 << 'PYEOF'
              import os, sys, shutil

              model_source = os.environ.get('model_source', 'huggingface')
              hf_id = os.environ.get('huggingface_id', '{{ .Values.llmAgent.model.huggingfaceId }}')
              minio_bucket = os.environ.get('minio_bucket', 'models')
              minio_path = os.environ.get('minio_path', '')
              cache_dir = '{{ .Values.llmAgent.model.cacheDir }}/current'
              marker = '{{ .Values.llmAgent.model.cacheDir }}/.download-marker'

              # Skip if already cached with same source
              source_key = f"{model_source}:{minio_path or hf_id}"
              if os.path.exists(marker) and os.path.exists(f'{cache_dir}/config.json'):
                  with open(marker) as f:
                      if f.read().strip() == source_key:
                          print(f"Model already cached: {source_key}")
                          sys.exit(0)

              os.makedirs(cache_dir, exist_ok=True)

              if model_source == 'minio' and minio_path:
                  import boto3
                  from botocore.client import Config
                  s3 = boto3.client('s3',
                      endpoint_url=os.environ['MINIO_ENDPOINT'],
                      aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],
                      aws_secret_access_key=os.environ['MINIO_SECRET_KEY'],
                      config=Config(signature_version='s3v4'),
                      region_name='us-east-1')
                  resp = s3.list_objects_v2(Bucket=minio_bucket, Prefix=minio_path)
                  objects = resp.get('Contents', [])
                  if objects:
                      if os.path.exists(cache_dir):
                          shutil.rmtree(cache_dir)
                      os.makedirs(cache_dir, exist_ok=True)
                      for obj in objects:
                          key = obj['Key']
                          fname = key[len(minio_path):].lstrip('/')
                          if fname:
                              fdir = os.path.dirname(f'{cache_dir}/{fname}')
                              if fdir:
                                  os.makedirs(fdir, exist_ok=True)
                              s3.download_file(minio_bucket, key, f'{cache_dir}/{fname}')
                          print(f"Downloaded: {fname}")
                      print(f"Fine-tuned model loaded from MinIO: {minio_bucket}/{minio_path}")
                  else:
                      print(f"No model at {minio_bucket}/{minio_path}, falling back to HuggingFace")
                      model_source = 'huggingface'

              if model_source != 'minio' or not minio_path:
                  from huggingface_hub import snapshot_download
                  if os.path.exists(cache_dir):
                      shutil.rmtree(cache_dir)
                  token = os.environ.get('HF_TOKEN', '')
                  snapshot_download(
                      repo_id=hf_id,
                      local_dir=cache_dir,
                      token=token if token else None,
                      ignore_patterns=['*.bin', '*.msgpack', '*.h5'],
                  )
                  print(f"Base model downloaded from HuggingFace: {hf_id}")

              with open(marker, 'w') as f:
                  f.write(source_key)
              print("Model ready at", cache_dir)
              PYEOF
          envFrom:
            - configMapRef:
                name: vllm-model-config
                optional: true
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: endpoint, optional: true }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: access_key, optional: true }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: secret_key, optional: true }
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token, optional: true }
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.llmAgent.model.cacheDir }}
          resources:
            requests: { memory: "4Gi", cpu: "2" }
            limits:   { memory: "8Gi", cpu: "4" }
      containers:
        - name: vllm
          image: "{{ .Values.llmAgent.image }}"
          imagePullPolicy: {{ .Values.llmAgent.imagePullPolicy | default .Values.global.imagePullPolicy }}
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            - --model={{ .Values.llmAgent.model.cacheDir }}/current
            - --max-model-len={{ .Values.llmAgent.model.maxModelLen }}
            - --gpu-memory-utilization={{ .Values.llmAgent.model.gpuMemoryUtilization }}
            - --dtype={{ .Values.llmAgent.model.dtype }}
            - --host=0.0.0.0
            - --port=8000
            - --served-model-name={{ .Values.llmAgent.model.name }}
          ports:
            - { containerPort: 8000, name: http }
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token, optional: true }
          resources:
            requests:
              memory: {{ .Values.llmAgent.resources.requests.memory | quote }}
              cpu: {{ .Values.llmAgent.resources.requests.cpu | quote }}
              {{- if .Values.llmAgent.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.llmAgent.gpu.count }}
              {{- end }}
            limits:
              memory: {{ .Values.llmAgent.resources.limits.memory | quote }}
              cpu: {{ .Values.llmAgent.resources.limits.cpu | quote }}
              {{- if .Values.llmAgent.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.llmAgent.gpu.count }}
              {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.llmAgent.model.cacheDir }}
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.llmAgent.persistence.storageClass }}
        storageClassName: {{ .Values.llmAgent.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.llmAgent.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-agent
  labels: { app: llm-agent }
spec:
  selector: { app: llm-agent }
  ports:
    - { name: http, port: {{ .Values.llmAgent.port }}, targetPort: {{ .Values.llmAgent.port }} }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-agent-headless
spec:
  clusterIP: None
  selector: { app: llm-agent }
  ports:
    - { name: http, port: {{ .Values.llmAgent.port }} }
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-agent-pdb
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: { app: llm-agent }
{{- end }}
{{- end }}
