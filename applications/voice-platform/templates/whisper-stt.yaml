{{- if .Values.whisperStt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-stt
  labels:
    app: whisper-stt
    component: stt
spec:
  replicas: {{ .Values.whisperStt.replicas }}
  selector:
    matchLabels: { app: whisper-stt }
  template:
    metadata:
      labels: { app: whisper-stt, component: stt }
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.whisperStt.tolerations }}
      tolerations: {{- toYaml .Values.whisperStt.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.whisperStt.nodeSelector }}
      nodeSelector: {{- toYaml .Values.whisperStt.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: whisper-stt
          image: "{{ .Values.global.imageRegistry }}{{ .Values.whisperStt.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: WHISPER_MODEL_SIZE
              value: {{ .Values.whisperStt.model.size | quote }}
            - name: WHISPER_DEVICE
              value: {{ .Values.whisperStt.model.device | quote }}
            - name: WHISPER_COMPUTE_TYPE
              value: {{ .Values.whisperStt.model.computeType | quote }}
          resources:
            requests:
              memory: {{ .Values.whisperStt.resources.requests.memory | quote }}
              cpu: {{ .Values.whisperStt.resources.requests.cpu | quote }}
              {{- if .Values.whisperStt.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.whisperStt.gpu.count }}
              {{- end }}
            limits:
              memory: {{ .Values.whisperStt.resources.limits.memory | quote }}
              cpu: {{ .Values.whisperStt.resources.limits.cpu | quote }}
              {{- if .Values.whisperStt.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.whisperStt.gpu.count }}
              {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-stt
  labels: { app: whisper-stt }
spec:
  selector: { app: whisper-stt }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
{{- end }}
