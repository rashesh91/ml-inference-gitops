# E2E single-node GPU deployment
global:
  imageRegistry: ""
  imagePullPolicy: Never   # custom images only; vLLM uses its own pullPolicy below

whisperStt:
  gpu:
    enabled: false
  model:
    size: small
    device: cpu
    computeType: int8
  resources:
    requests: { memory: "2Gi", cpu: "2" }
    limits:   { memory: "4Gi", cpu: "8" }
  tolerations: []
  nodeSelector: {}

llmAgent:
  backend: vllm
  port: 8000
  imagePullPolicy: IfNotPresent
  gpu:
    enabled: true
    count: 1
  model:
    name: "assistant"
    huggingfaceId: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    cacheDir: /model-cache
    maxModelLen: 2048
    gpuMemoryUtilization: 0.85
    dtype: "float16"
  resources:
    requests: { memory: "8Gi", cpu: "2" }
    limits:   { memory: "20Gi", cpu: "4" }
  persistence:
    size: 30Gi
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
  nodeSelector:
    nvidia.com/gpu: "true"

minio:
  endpoint: "http://minio.ml-training.svc.cluster.local:9000"
  accessKey: "minioadmin"
  secretKey: "minioadmin"

ttsService:
  replicas: 1

voiceGateway:
  replicas: 1
  ingress:
    host: aitest.lintel.in
    tlsSecret: aitest-tls

podDisruptionBudget:
  enabled: false

priorityClassName: ""

monitoring:
  enabled: false
