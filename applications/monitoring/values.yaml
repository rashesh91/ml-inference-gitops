# kube-prometheus-stack values
# Install via ArgoCD or: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n infra -f values.yaml

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        memory: 2Gi
        cpu: "500m"
      limits:
        memory: 4Gi
        cpu: "2"
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    additionalScrapeConfigs:
      - job_name: vllm-gpu-workloads
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [gpu-workloads, dev, staging, prod]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1

grafana:
  enabled: true
  adminPassword: "changeme-in-production"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: ml-infra
          folder: ML Infrastructure
          type: file
          options:
            path: /var/lib/grafana/dashboards/ml-infra
  dashboardsConfigMaps:
    ml-infra: "grafana-ml-dashboards"

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: null-receiver
    receivers:
      - name: null-receiver  # Replace with Slack/PagerDuty in prod

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
