# Run this to verify GPU Operator is working correctly
# kubectl apply -f gpu-test-pod.yaml
# kubectl logs gpu-test -n gpu-workloads
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: gpu-workloads
  labels:
    purpose: validation
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda-test
      image: nvidia/cuda:12.2.0-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
  nodeSelector:
    nvidia.com/gpu: "true"
