# NVIDIA GPU Operator Helm values
# Install: helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
#          helm install gpu-operator nvidia/gpu-operator -n infra -f values.yaml

operator:
  defaultRuntime: containerd

driver:
  enabled: false  # Drivers pre-installed on node (580.x)

toolkit:
  enabled: false  # k3s uses its own containerd; configured manually via config.toml.tmpl

devicePlugin:
  enabled: false  # Installed manually as a daemonset

# Time-slicing allows multiple pods to share one GPU
# Useful for development and smaller models
timeSlicing:
  enabled: false  # Enable for dev environments sharing GPUs
  config:
    default:
      strategy: none
      resources:
        - name: nvidia.com/gpu
          replicas: 4  # 4 virtual GPUs per physical GPU

dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    honorLabels: false

nodeFeatureDiscovery:
  enabled: true

mig:
  strategy: none  # Use 'single' or 'mixed' for A100/H100 MIG support

validator:
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "true"
