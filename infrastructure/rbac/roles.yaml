apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-pod-reader
  namespace: gpu-workloads
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-pod-reader-binding
  namespace: gpu-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vllm-pod-reader
subjects:
  - kind: ServiceAccount
    name: vllm-serving
    namespace: gpu-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-gpu-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-node-reader
subjects:
  - kind: ServiceAccount
    name: monitoring-reader
    namespace: infra
---
# Read-only role for auditing across namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-infra-auditor
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
