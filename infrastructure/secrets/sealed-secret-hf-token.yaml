# Sealed Secret for HuggingFace token
# Generate your own with:
#   echo -n "YOUR_HF_TOKEN" | kubectl create secret generic hf-token \
#     --dry-run=client --from-file=token=/dev/stdin -o yaml | \
#     kubeseal --controller-namespace infra -o yaml > sealed-secret-hf-token.yaml
#
# Install sealed-secrets controller:
#   helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#   helm install sealed-secrets-controller sealed-secrets/sealed-secrets -n infra

# THIS IS A TEMPLATE — replace encryptedData with your actual sealed value
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hf-token
  namespace: gpu-workloads
spec:
  encryptedData:
    token: REPLACE_WITH_YOUR_SEALED_TOKEN
  template:
    metadata:
      name: hf-token
      namespace: gpu-workloads
    type: Opaque
