<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice AI Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232636;
      --border: #2e3245;
      --accent: #6c63ff;
      --accent2: #48cfad;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --user-bubble: #2d3a5a;
      --ai-bubble: #1e2235;
      --danger: #fc5c65;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 12px; color: var(--text-muted); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent2);
      margin-left: auto;
      box-shadow: 0 0 8px var(--accent2);
      flex-shrink: 0;
    }
    .status-dot.offline { background: #555; box-shadow: none; }
    .status-dot.busy    { background: #f7b731; box-shadow: 0 0 8px #f7b731; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 75%;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

    .message.user  { align-self: flex-end; flex-direction: row-reverse; }
    .message.agent { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .message.user  .avatar { background: var(--accent); }
    .message.agent .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
    }
    .message.user  .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
    .message.agent .bubble { background: var(--ai-bubble);   border-bottom-left-radius: 4px; border: 1px solid var(--border); }

    .bubble .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* tool call indicator */
    .tool-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(108,99,255,.15);
      border: 1px solid rgba(108,99,255,.3);
      color: #a29bfe;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }

    /* thinking animation */
    .dots span {
      display: inline-block; width: 6px; height: 6px;
      background: var(--text-muted); border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-6px); }
    }

    /* ── Visualizer ── */
    #visualizer-wrap {
      padding: 0 24px 12px;
      display: flex; align-items: center; justify-content: center;
    }
    canvas#viz {
      width: 100%; max-width: 480px; height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    /* ── Controls ── */
    .controls {
      padding: 16px 24px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #status-label {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
      text-align: center;
    }

    .mic-btn {
      width: 64px; height: 64px; border-radius: 50%;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #9b59b6);
      color: white; font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(108,99,255,.4);
      transition: transform .15s, box-shadow .15s;
      position: relative;
    }
    .mic-btn:hover  { transform: scale(1.06); }
    .mic-btn.active {
      background: linear-gradient(135deg, var(--danger), #e74c3c);
      box-shadow: 0 4px 24px rgba(252,92,101,.5);
      animation: pulse 1.4s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(252,92,101,.5); }
      50%        { box-shadow: 0 4px 32px rgba(252,92,101,.8); }
    }
    .mic-btn:disabled {
      opacity: .4; cursor: not-allowed; transform: none;
      box-shadow: none; animation: none;
    }

    .bottom-row {
      display: flex; align-items: center; gap: 16px;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--border); color: var(--text); }

    /* text input fallback */
    .text-row {
      width: 100%; max-width: 480px;
      display: flex; gap: 8px;
    }
    #text-input {
      flex: 1;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      color: var(--text); font-size: 14px; outline: none;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-send {
      background: var(--accent); border: none; border-radius: 10px;
      color: white; padding: 10px 18px; cursor: pointer; font-size: 14px;
    }
    #text-send:hover { opacity: .85; }

    /* scrollbar */
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🎙</div>
  <div>
    <h1>Voice AI Agent</h1>
    <p>Powered by Whisper · Mistral · ArgoCD</p>
  </div>
  <div class="status-dot offline" id="conn-dot" title="WebSocket status"></div>
</header>

<div id="chat">
  <div class="message agent">
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="label">Assistant</div>
      Hello! I'm your voice AI assistant. Click the mic button and ask me anything — I can search the web, check the weather, do math, and more.
    </div>
  </div>
</div>

<div id="visualizer-wrap">
  <canvas id="viz"></canvas>
</div>

<div class="controls">
  <div id="status-label">Ready</div>
  <div class="bottom-row">
    <button class="icon-btn" id="clear-btn" title="Clear conversation">🗑</button>
    <button class="mic-btn" id="mic-btn" title="Hold to speak">🎙</button>
    <button class="icon-btn" id="stop-btn" title="Stop audio" style="display:none">⏹</button>
  </div>
  <div class="text-row">
    <input type="text" id="text-input" placeholder="Or type a message..." autocomplete="off" />
    <button id="text-send">Send</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
